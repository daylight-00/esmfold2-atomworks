name: ci

# Deliberately small. The core suite, feature parity included, needs the esm
# and atomworks source trees plus torch and a CCD download -- only the Foundry
# contract tests also need the foundry tree -- which is minutes of setup for a
# check that is already run locally and recorded in docs/02_PARITY.md.
# What runs here is everything that needs nothing but this repository, so it
# stays fast enough to be worth having on every push.
#
# To run the full suite, see docs/04_ENVIRONMENT.md (an ordinary install) or
# reproducibility/README.md (the pinned reference environment).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Pinned so CI and a local run agree. Keep this identical to the `dev`
      # group in pyproject.toml -- when they drift, `ruff format --check` fails
      # here on files that are correctly formatted locally, which is noise
      # rather than signal. (Foundry currently pins 0.8.3, which formats some
      # files differently; expect one reformat commit when upstreaming.)
      - run: pip install ruff==0.16.6
      - run: ruff check src tests
      - run: ruff format --check src tests

  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest numpy omegaconf
      # The `offline` marker selects the tests that need no source trees: the
      # gold-fixture invariants, which stop a frozen-but-wrong snapshot from
      # silently anchoring the parity suite, and the strictness and declaration
      # checks, which hold the adapter's refusal policy in place.
      - run: pytest -m offline -v
        env:
          PYTHONPATH: src

  packaging:
    # The configs live at the repo root and must land inside the package in the
    # wheel, or `pkg://esmfold2_atomworks.configs` fails for anyone who installs
    # rather than clones. A source checkout cannot reveal that, so this builds
    # and installs for real. Needs only hatchling and hydra-core.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install build hydra-core
      - run: python -m build --wheel --outdir dist
      # --no-deps: the wheel's dependencies are esm, atomworks and torch --
      # minutes to install, and biotite 1.4.0 has no cp314 wheel -- while this
      # job checks what is packaged. The next step checks that they resolve.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --quiet --no-deps dist/*.whl hydra-core
      - name: Packaged configs compose
        run: /tmp/wheelenv/bin/python scripts/check_packaging.py
      - name: Declared dependencies resolve
        run: |
          pip install --quiet uv
          uv pip compile pyproject.toml --extra foundry --python-version 3.12 \
            --torch-backend cpu --quiet > /dev/null

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # UPSTREAM.lock is what makes an "exact parity" claim reproducible, so a
      # malformed one should fail loudly rather than be discovered later.
      # The required trees must be recorded; foundry, which only the optional
      # integration needs, is checked when present.
      - name: UPSTREAM.lock parses and names every required tree
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from esmfold2_atomworks import paths
          locked = paths.read_upstream_lock(paths.REPO_ROOT / "UPSTREAM.lock")
          missing = [t for t in paths.REQUIRED_TREES if t not in locked]
          assert not missing, f"UPSTREAM.lock is missing {missing}"
          unknown = [t for t in locked if t not in paths.LOCKED_TREES]
          assert not unknown, f"UPSTREAM.lock names unknown trees {unknown}"
          for tree, entry in locked.items():
              commit = entry.get("commit", "")
              assert len(commit) == 40, f"{tree}: {commit!r} is not a full SHA"
              assert entry.get("repo", "").startswith("https://"), f"{tree}: no repo url"
          print(f"UPSTREAM.lock ok: {', '.join(sorted(locked))}")
          PY
