# @package _global_
# The searchpath lets an installed package find its own configs. Foundry's
# models also list `pkg://configs`; that package does not exist in this
# repository, and Hydra warns on every compose for a searchpath it cannot
# resolve, so it is omitted here. Add it back when moving into foundry/models/,
# where the rest of the files carry it.
hydra:
  searchpath:
    - pkg://esmfold2_atomworks.configs

defaults:
  - inference_engine: esmfold2
  - _self_
