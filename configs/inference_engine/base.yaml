# @package _global_
# Parameters for ESMFold2InferenceEngine.__init__()
ckpt_path: null        # weight directory or HF repo id; null -> paths.ESMFOLD2_WEIGHTS.standard
device: null           # null -> cuda when available, else cpu
load_esmc: true        # false: no backbone for a separate-layout checkpoint (docs/04)
chunk_size: 64         # null is faster below L~600; 64 fits L~2k on 80 GB
verbose: false
seed: null
# Degradations to accept by name instead of raising; empty = strict.
# Whatever is accepted is recorded per output under adapter.degradations.
allow: []
# How atomworks.io.parse reads a path: null for its defaults, or a mapping of
# its options. Recorded per output under atomworks.parse_config.
parse_config: null

# Sampling. num_loops: null defers to the loaded checkpoint's config.num_loops,
# which differs between checkpoint revisions (3 and 20, docs/04), so a number
# here overrides whichever is loaded. Set one to pin a schedule.
num_loops: null
num_sampling_steps: 100
num_diffusion_samples: 1
lm_dropout: 0.3        # esm's fold() default; the LM dropout stays active at inference
lm_mask_pct: null      # null -> the loaded checkpoint's config.lm_mask_pct

# The sampler's knobs, which esm >= 3.4 hands to the structure head. null leaves
# each to the loaded model: the two scales to its structure-head config, the
# sigma cap to forward's default (256). Each output's JSON records the values
# that ran under esmfold2.effective.*. (early_exit is deprecated upstream and
# ignored, so it is not here.) See docs/03_MODEL.md.
noise_scale: null
step_scale: null
max_inference_sigma: null

# Parameters for ESMFold2InferenceEngine.run()
inputs: ???
out_dir: ???
