# @package _global_
# `base` is also `@package _global_`, so without this header the `_target_`
# below would land at `cfg.inference_engine._target_` while every parameter
# landed at the root -- and `hydra.utils.instantiate(cfg)` would find no target.
# Only visible when the config is actually composed, which is why the packaging
# test does exactly that.
defaults:
  - base
  - _self_

_target_: esmfold2_atomworks.inference.engine.ESMFold2InferenceEngine
