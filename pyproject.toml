[project]
name = "esmfold2-atomworks"
version = "0.1.0"
description = "ESMFold2 on AtomWorks structures, with native ESMFold2 feature semantics preserved exactly"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "daylight-00" }]
requires-python = ">=3.12"
dependencies = [
    # esm >= 3.4 ships the ESMFold2 module itself.
    "esm>=3.4",
    "atomworks>=2.2",
    "biotite",
    "numpy",
    "torch",
    "typer",
]

[project.optional-dependencies]
# Training through Foundry: training/ and configs/. rc-foundry supports
# Python 3.12 only, so this extra does too.
foundry = ["rc-foundry>=0.1"]

[project.urls]
Repository = "https://github.com/daylight-00/esmfold2-atomworks"

[project.scripts]
esmfold2-atomworks = "esmfold2_atomworks.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff==0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esmfold2_atomworks"]

# The Hydra configs live at the repo root but must be importable as
# `esmfold2_atomworks.configs` once installed, because that is what the
# `pkg://esmfold2_atomworks.configs` searchpath in configs/*.yaml resolves
# against. Without this the configs are not in the wheel, and an installed
# package fails to compose -- which a source checkout does not reveal.
[tool.hatch.build.targets.wheel.force-include]
"configs" = "esmfold2_atomworks/configs"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint]
extend-select = ["I", "F401"]
ignore = [
    "F722", # jaxtyping shape annotations
    "F821", # jaxtyping forward references
    "E741", # variables like "L"
    # typer declares CLI arguments as defaults; it is the library's only API for
    # help text and options, and Foundry's own cli.py modules do the same.
    "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "gpu: requires a GPU and the ESMFold2 weights",
    "slow: takes more than a few seconds",
    # Needs nothing but this repository -- no source trees, no torch, no
    # network. CI runs exactly these, which is what makes CI cheap enough to be
    # worth having (see .github/workflows/ci.yml).
    "offline: runs without esm, atomworks or foundry installed",
]
