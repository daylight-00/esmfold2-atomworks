[project]
name = "esmfold2-atomworks"
version = "0.4.0"
description = "ESMFold2 on AtomWorks structures, with native ESMFold2 feature semantics preserved exactly"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "daylight-00" }]
requires-python = ">=3.12"
dependencies = [
    # The ESMFold2 module ships in esm >= 3.4; 3.4.1.post1 is the release this
    # package was verified against.
    "esm>=3.4.1.post1",
    "atomworks[ml]>=3.0",
    "biotite",
    "numpy",
    "torch",
    "typer",
]

[project.optional-dependencies]
# Training through Foundry: training/ and configs/. rc-foundry supports
# Python 3.12 only, so this extra does too.
foundry = ["rc-foundry>=0.1"]

[project.urls]
Repository = "https://github.com/daylight-00/esmfold2-atomworks"

[project.scripts]
esmfold2-atomworks = "esmfold2_atomworks.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff==0.16.6",
    # The packaged Hydra configs are composed and checked by tests and by
    # scripts/check_packaging.py.
    "omegaconf",
    "hydra-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esmfold2_atomworks"]

# The Hydra configs live at the repo root but must be importable as
# `esmfold2_atomworks.configs` once installed, because that is what the
# `pkg://esmfold2_atomworks.configs` searchpath in configs/*.yaml resolves
# against. Without this the configs are not in the wheel, and an installed
# package fails to compose -- which a source checkout does not reveal.
[tool.hatch.build.targets.wheel.force-include]
"configs" = "esmfold2_atomworks/configs"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "E741", # variables like "L"
    # typer declares CLI arguments as defaults; it is the library's only API for
    # help text and options.
    "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not gpu'"
markers = [
    "gpu: requires a GPU and the ESMFold2 weights",
    "slow: takes more than a few seconds",
    # Needs only numpy and omegaconf: no esm, atomworks, foundry, torch or
    # network. CI runs these (see .github/workflows/ci.yml).
    "offline: runs without esm, atomworks or foundry installed",
]
