# Upstream revisions this repository's parity claims were verified against.
#
# The source trees are consumed from PYTHONPATH rather than pinned by a package
# manager (see README.md beside this file), so this file records the revision
# that produced a result. esm and atomworks are required; foundry is recorded
# because the optional integration was verified against it.
#
# `esmfold2-atomworks doctor` compares these against the trees it finds -- or,
# in an ordinary install, against the installed packages' versions -- and
# reports any drift. Drift is reported, never enforced -- the adapter is
# deliberately version-tolerant, so a newer tree is a thing to re-verify, not a
# thing to refuse.
#
# To re-pin after verifying against newer trees, update each entry by hand:
#   git -C <tree> rev-parse HEAD

[esm]
repo = https://github.com/Biohub/esm
commit = 43b4548b86762edfa747b07d5f440aad3c33acee
version = 3.4.1.post1
note = ESMFold2 module ships inside the esm package (>= 3.4)

[atomworks]
repo = https://github.com/RosettaCommons/atomworks
commit = 379b4bbe45b12fbcd5606b80ca32590463c7acff
version = 3.0.0
note = installed as a package (atomworks[ml]==3.0.0 in uv.lock); commit is what the v3.0.0 tag points at

[foundry]
repo = https://github.com/RosettaCommons/foundry
commit = b02eed6a6bdf8f44d14a80cc36e3da13c9f2291c
version = 0.1.0
