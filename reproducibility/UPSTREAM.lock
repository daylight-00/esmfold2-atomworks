# Upstream revisions this repository's parity claims were verified against.
#
# esm and foundry are consumed from PYTHONPATH as source trees rather than pinned
# by a package manager (see README.md beside this file), so this file records the
# revision that produced a result. atomworks is a package, pinned in uv.lock; its
# entry records the release. esm and atomworks are required; foundry is recorded
# because the optional integration was verified against it.
#
# `esmfold2-atomworks doctor` compares these against the trees it finds -- or,
# for an installed package, against its version -- and reports any drift. Drift
# is reported, never enforced -- the adapter is deliberately version-tolerant, so
# a newer upstream is a thing to re-verify, not a thing to refuse.
#
# To re-pin after verifying against newer upstreams, update each entry by hand:
#   git -C <tree> rev-parse HEAD        (a source tree)
#   pip show atomworks                  (the package; the commit is its release tag)

[esm]
repo = https://github.com/Biohub/esm
commit = 90d6497a546bb55929c2d3ca2e313d4613ec1922
version = 3.4.2
note = main after the v3.4.2 tag (8f0834c), not on PyPI; its pyproject still says 3.4.2 and requires transformers>=5.16

[atomworks]
repo = https://github.com/RosettaCommons/atomworks
commit = 1a9fa25fec3709b73493edfaba31d131dabddbbc
version = 3.0.4
note = installed as a package (atomworks[ml]==3.0.4 in uv.lock); commit is what the v3.0.4 tag points at

[foundry]
repo = https://github.com/RosettaCommons/foundry
commit = b02eed6a6bdf8f44d14a80cc36e3da13c9f2291c
version = 0.1.0
