# The reference environment: the Python environment the published parity
# results were produced in. It is not how the package is installed -- the
# repository's own pyproject.toml is -- but a record of one verified setup,
# kept reproducible. See README.md in this directory.
#
# esm, atomworks and foundry are not listed. Here they are source trees at the
# revisions recorded in UPSTREAM.lock, put on PYTHONPATH by env.sh, because
# their package metadata would pull this environment back: esm 3.4 pins
# torch>=2.11,<2.12 and atomworks pins biotite==1.4.0, which has no cp314 wheel.
# (Foundry's own pins conflict with nothing here, but it depends on atomworks.)
# What IS listed is the union of their runtime imports plus this package's own,
# pinned to the versions the results were produced with. When a tree grows a new
# import, add it to the matching group -- do not add the tree itself.

[project]
name = "esmfold2-atomworks-reference"
version = "0"
requires-python = "==3.14.*"
dependencies = [
    "pip==26.2.1",
    "torch==2.14.0",
    "numpy==2.5.2",
    "scipy==1.18.1",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "scikit-learn==1.9.0",
    "rdkit==2026.3.6",
    "biotite==1.6.0",
    "biopython==1.88",
    "tqdm==4.70.0",
    "typer==0.27.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.6",
    "ipykernel==7.3.0",
]
# --- shared numerics / serialization used by the esm and atomworks trees ---
common = [
    "brotli==1.2.0",
    "einops==0.8.2",
    "zstd==1.5.7.2",
    "zstandard==0.25.0",
    "cuequivariance_ops_cu13==0.11.1",
    "cuequivariance_ops_torch_cu13==0.11.1",
    "cuequivariance_torch==0.11.1",
]
# --- imports required by the esm source tree (esm >= 3.4 ships the model) ---
esm = [
    "transformers==4.57.6",
    "huggingface_hub==0.36.2",
    "safetensors==0.8.0",
    "accelerate==1.14.0",
    "cloudpathlib==0.25.0",
    "msgpack_numpy==0.4.8",
    "attrs==26.1.0",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "ipywidgets==8.1.9",
    "py3Dmol==2.5.5",
    "pydssp==0.9.1",
    "boto3==1.43.89",
    "pygtrie==2.6.1",
    "dna_features_viewer==3.1.5",
]
# --- imports required by the atomworks source tree ---
atomworks = [
    "jaxtyping==0.3.11",
    "toolz==1.1.0",
    "py3Dmol==2.5.5",
    "pymol-remote==1.1.0",
    "hydride==1.2.3",
]
# --- the Foundry integration: the foundry tree's imports, then those of
#     Foundry's own models (rf3, rfd3), which share its tree ---
foundry = [
    "hydra-core==1.3.6",
    "lightning==2.6.5",
    "wandb==0.29.0",
    "beartype==0.22.9",
    "rich==15.0.0",
    "rootutils==1.0.7",
    "environs==15.2.0",
    "python-dotenv==1.2.3",
    "pydantic==2.13.5",
    "loralib==0.1.2",
    "opt_einsum==3.4.0",
    "assertpy==1.1",
    "cython==3.3.0",
    "cytoolz==1.1.0",
    "einx==0.4.3",
    "dm-tree==0.1.10",
]
[tool.uv]
# A record, not a package: `uv sync --project reproducibility` builds the
# environment and installs nothing of its own. The package itself is put on
# PYTHONPATH from ../src by env.sh, next to the source trees.
package = false
default-groups = ["dev", "common", "esm", "atomworks", "foundry"]
# The platform the results were produced on.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
]
# Transitive dependencies held to the versions the results were produced with,
# so that the lock reproduces the verified environment rather than today's
# resolution of it.
constraint-dependencies = [
    "botocore==1.43.89",
    "contourpy==1.3.3",
    "cuda-bindings==13.3.1",
    "cuda-pathfinder==1.8.1",
    "cuequivariance==0.11.1",
    "debugpy==1.8.21",
    "filelock==3.32.5",
    "fonttools==4.64.0",
    "fsspec==2026.7.0",
    "idna==3.19",
    "matplotlib==3.11.1",
    "multidict==6.7.1",
    "narwhals==2.25.0",
    "nest-asyncio2==1.7.2",
    "networkx==3.6.1",
    "nvidia-nvjitlink==13.3.33",
    "platformdirs==4.11.7",
    "propcache==0.5.2",
    "protobuf==7.36.1",
    "pure-eval==0.2.3",
    "pyparsing==3.3.2",
    "pytorch-lightning==2.6.5",
    "regex==2026.9.3",
    "sentry-sdk==2.68.1",
    "threadpoolctl==3.6.0",
    "tornado==6.5.8",
    "urllib3==2.7.0",
    "wcwidth==0.8.3",
    "wrapt==2.4.0",
    "yarl==1.24.5",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
